<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planet Forge</title>
<style>

body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;touch-action:none}

h1{margin:8px 0 0;font-size:22px;font-weight:700}
.sub{color:var(--mu);margin-bottom:10px}
label{display:flex;justify-content:space-between;margin:10px 0 3px;color:var(--mu);font-size:12px}
label b{color:var(--tx);font-weight:600}
input,select,button{width:100%;box-sizing:border-box;background:#ffffff12;color:var(--tx);border:1px solid #ffffff25;border-radius:8px;padding:7px 8px;font:inherit}
select option{background:#10141f}
input[type=range]{padding:0;accent-color:var(--ac)}
.row{display:flex;gap:6px}.row>*{flex:1}.row input{flex:3}
button{cursor:pointer}button:hover{background:#ffffff24}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--mu)}.chk input{width:auto}
#st{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:12px;padding-top:10px;border-top:1px solid #ffffff1c;font-size:12px}
#st span{color:var(--mu)}#st b{font-weight:600;text-align:right}
</style></head><body>
<details id="ui" open><summary>Planet Forge</summary>
<h1 id="nm"></h1><div class="sub" id="sub"></div>
<label>Seed <b>1 of 999,999,999 worlds</b></label>
<div class="row"><button id="pv">◀</button><input id="seed" type="number" min="0" max="999999999" value="4217"><button id="nx">▶</button><button id="rn">🎲</button></div>
<label>Planet type</label>

<label>Size <b id="sv"></b></label><input id="size" type="range" min="0" max="100" value="38">
<label>Surface gravity <b id="gv"></b></label><input id="grav" type="range" min="0.1" max="5" step="0.05" value="1">
<label>Rings</label>
<select id="rings"><option value="-1">Auto (from seed)</option><option value="1">Yes</option><option value="0">No</option></select>
<label>Ring composition</label>
<select id="comp"><option value="-1">Auto</option><option value="0">Water ice</option><option value="1">Dark rock</option><option value="2">Fine dust</option><option value="3">Metallic</option><option value="4">Crystal / iridescent</option><option value="5">Mixed ice &amp; rock</option></select>
<div class="chk"><input id="rot" type="checkbox" checked><span>Spin planet</span></div>
<div id="st"></div>
<div class="sub" style="margin-top:10px">Drag to orbit · scroll / pinch to zoom. Gravity flattens terrain, thickens atmosphere &amp; tightens gas bands.</div>

const CF=`varying vec3 vP,vW;uniform float uCov,uTime;uniform vec3 uSeed,uL,uCl;uniform mat3 uM;
${NZ}
void main(){vec3 P=normalize(vP);float n=fbm(P*vec3(2.5,3.5,2.5)*1.2+uSeed+vec3(0.,0.,uTime*.01))*.8+.2*vn(P*20.);

const AF=`varying vec3 vN,vW;uniform vec3 uL,uCol;uniform float uI,uP;

 if(t==1){const h=h0;P.c=[hx(h,.5,.55),hx(h+.05,.55,.7),hx(h-.04,.4,.35),hx(h+.1,.6,.8)];P.atm=hx(h,.5,.6);P.atmK=.6;P.temp=R(90,400)}
 if(t==2){const h=R(.5,.64);P.c=[hx(h,.6,.45),hx(h+.03,.55,.6),hx(h-.03,.5,.35),hx(h,.4,.85)];P.warp*=.4;P.atm=hx(h,.6,.6);P.temp=R(50,90)}
 if(t==3){P.sea=R(.55,.75);const h=wild?h0:.58;P.c=[hx(h,.7,.12),hx(h-.03,.65,.4),hx(pick,.4,.3),hx(.1,.2,.55)];P.cap=R(.85,1.3);P.cloud=R(.4,.75);P.temp=R(270,320)}
 if(t==4){P.sea=R(.2,.4);P.c=[hx(R(0,.05),1,.5),hx(R(.08,.15),1,.6),hx(0,.1,.06),hx(.03,.2,.14)];P.cloud=.35;P.cl=hx(.02,.2,.12);P.atm=hx(.05,.9,.5);P.atmK=1.3;P.temp=R(800,1500)}
 if(t==5){P.c=[hx(0,0,0),hx(0,0,0),hx(wild?h0:R(.04,.11),.55,.45),hx(wild?h0+.04:R(.07,.15),.5,.7),];P.cap=R(1,1.3);P.cloud=.15;P.atm=hx(.07,.5,.6);P.temp=R(300,380)}
 if(t==6){P.c=[hx(.6,.7,.3),hx(0,0,0),hx(.58,.3,.8),hx(.55,.2,.95)];P.cloud=.15;P.atm=hx(.58,.5,.7);P.temp=R(40,200)}

function nm(s){const r=mb(s*91+5),S=['ka','ro','vel','tha','zor','mi','xen','ar','ul','pa','del','qui','nox','eri','sol','ba','yth','or','lun','cae','vor','ish'];let n='';for(let i=0,k=2+(r()*2|0);i<k;i++)n+=S[r()*S.length|0];return n[0].toUpperCase()+n.slice(1)+' '+['I','II','III','IV','V','VI','VII','b','c','d'][r()*10|0]}
