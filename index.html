<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puter Chat · Claude 3.7</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --bubble-user: #0b84ff;
      --bubble-ai: #2c2c2e;
      --text-secondary: #8e8e93;
      --divider: #3a3a3c;
      --accent: #0b84ff;
      --radius: 18px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ---------- HEADER ---------- */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #30d158;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    #model-select {
      margin-left: auto;
      background: #1c1c1e;
      color: #fff;
      border: 1px solid var(--divider);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-family: var(--font);
      outline: none;
      cursor: pointer;
      max-width: 190px;
      transition: border-color 0.2s;
    }
    #model-select:hover, #model-select:focus { border-color: var(--accent); }

    /* ---------- MESSAGES ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }

    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 15.5px;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
      position: relative;
      animation: pop 0.18s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.96) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .msg-row.user .bubble {
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .msg-row.ai .bubble {
      background: var(--bubble-ai);
      color: #e5e5ea;
      border-bottom-left-radius: 6px;
      margin-left: 30px;
    }

    .msg-row.ai .bubble::before {
      content: "✦";
      position: absolute;
      left: -30px;
      bottom: 2px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0b84ff, #30d158);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
    }

    .model-tag {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.75;
    }

    /* ---------- TYPING ---------- */
    .typing { display: flex; align-items: center; gap: 5px; padding: 3px 2px; }
    .typing span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-5px); opacity: 1; }
    }

    /* ---------- SYSTEM NOTE ---------- */
    .system-note {
      align-self: center;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-secondary);
      background: #1c1c1e;
      border: 1px solid var(--divider);
      padding: 6px 12px;
      border-radius: 12px;
      max-width: 85%;
      animation: pop 0.18s ease-out;
    }

    /* ---------- INPUT BAR ---------- */
    #input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--divider);
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    #user-input {
      flex: 1;
      resize: none;
      background: #1c1c1e;
      border: 1px solid var(--divider);
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15.5px;
      font-family: var(--font);
      color: #fff;
      outline: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    #user-input::placeholder { color: #636366; }
    #user-input:focus { border-color: var(--accent); }

    #send-btn {
      flex-shrink: 0;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, opacity 0.2s;
    }
    #send-btn:hover:not(:disabled)  { transform: scale(1.06); }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; margin-left: 1px; }

    .powered {
      flex-shrink: 0;
      text-align: center;
      padding: 6px 0 10px;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg);
    }
    .powered a { color: var(--accent); text-decoration: none; }
    .powered a:hover { text-decoration: underline; }

    .error-bubble {
      background: #3a1c1c !important;
      color: #ff8a8a !important;
      border: 1px solid #5c2626;
    }

    @media (max-width: 500px) {
      .bubble { max-width: 85%; font-size: 15px; }
      #model-select { max-width: 130px; font-size: 11.5px; }
      header h1 { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="dot"></span>
      <h1>Puter Chat · Claude 3.7</h1>
      <select id="model-select" aria-label="Select AI model"></select>
    </header>

    <div id="messages" role="log" aria-live="polite"></div>

    <div id="input-bar">
      <textarea id="user-input" rows="1" placeholder="Message…"
                autocomplete="off" aria-label="Type your message"></textarea>
      <button id="send-btn" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <div class="powered">
      Powered by <a href="https://developer.puter.com" target="_blank" rel="noopener">Puter</a>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // ============================================================
      //  MODEL CONFIGURATION — Claude 3.7 Sonnet first
      // ============================================================
      const MODEL_CHAIN = [
        "claude-3-7-sonnet",          // ← primary: Claude 3.7 Sonnet
        "claude-3-7-sonnet-latest",
        "claude-sonnet-4",
        "claude-3-5-sonnet-latest",
        "claude-3-5-sonnet",
        "gpt-4o-mini",
      ];

      let currentModel = MODEL_CHAIN[0];   // "claude-3-7-sonnet"

      // ---------- DOM ----------
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const modelSelect = document.getElementById("model-select");

      // ---------- State ----------
      const conversation = [
        {
          role: "system",
          content:
            "You are a helpful, friendly assistant powered by Claude 3.7 Sonnet. " +
            "Keep answers concise and clear. Use plain text; avoid markdown unless the user asks for it.",
        },
      ];
      let isWaiting = false;

      // ============================================================
      //  RENDER HELPERS
      // ============================================================
      function scrollToBottom() {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      function appendBubble(text, role, extraClass, modelName) {
        const row = document.createElement("div");
        row.className = "msg-row " + role;

        const bubble = document.createElement("div");
        bubble.className = "bubble" + (extraClass ? " " + extraClass : "");
        bubble.textContent = text;

        if (modelName) {
          const tag = document.createElement("span");
          tag.className = "model-tag";
          tag.textContent = modelName;
          bubble.appendChild(tag);
        }

        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
        return bubble;
      }

      function appendSystemNote(text) {
        const note = document.createElement("div");
        note.className = "system-note";
        note.textContent = text;
        messagesEl.appendChild(note);
        scrollToBottom();
      }

      function showTyping() {
        const row = document.createElement("div");
        row.className = "msg-row ai";
        row.id = "typing-row";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.style.padding = "10px 14px";

        const typing = document.createElement("div");
        typing.className = "typing";
        for (let i = 0; i < 3; i++) typing.appendChild(document.createElement("span"));

        bubble.appendChild(typing);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
        return row;
      }

      function removeTyping() {
        const el = document.getElementById("typing-row");
        if (el) el.remove();
      }

      // ============================================================
      //  PUTER CALL WITH FALLBACK
      // ============================================================
      function isModelError(err) {
        const m = String((err && err.message) || err || "").toLowerCase();
        return (
          m.includes("model not found") ||
          m.includes("no such model") ||
          m.includes("unsupported model") ||
          m.includes("invalid model") ||
          m.includes("does not exist") ||
          m.includes("not available")
        );
      }

      function extractText(response) {
        if (!response) return "";
        if (typeof response === "string") return response;

        const content = response.message ? response.message.content : response.content;
        if (typeof content === "string") return content;

        if (Array.isArray(content)) {
          return content
            .map((block) => (typeof block === "string" ? block : block.text || ""))
            .join("");
        }
        return "";
      }

      async function chatWithFallback(history) {
        const chain = [
          currentModel,
          ...MODEL_CHAIN.filter((m) => m !== currentModel),
        ];

        let lastError = null;

        for (const model of chain) {
          try {
            const response = await puter.ai.chat(history, {
              model: model,
              normalize: true,
            });

            const text = extractText(response);
            if (!text) throw new Error("Empty response from " + model);

            return { text, model };
          } catch (err) {
            lastError = err;
            const msg = String((err && err.message) || err);

            if (isModelError(err)) {
              console.warn(`Model "${model}" unavailable, trying next…`);
              continue;
            }
            throw err;
          }
        }

        throw lastError || new Error("No available model could be reached.");
      }

      // ============================================================
      //  INPUT HANDLING
      // ============================================================
      function autoResize() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
      }

      function updateSendState() {
        sendBtn.disabled = inputEl.value.trim().length === 0 || isWaiting;
      }

      inputEl.addEventListener("input", () => {
        autoResize();
        updateSendState();
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      sendBtn.addEventListener("click", sendMessage);

      // ============================================================
      //  SEND MESSAGE
      // ============================================================
      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || isWaiting) return;

        appendBubble(text, "user");
        conversation.push({ role: "user", content: text });

        inputEl.value = "";
        autoResize();
        isWaiting = true;
        updateSendState();
        showTyping();

        try {
          const { text: reply, model } = await chatWithFallback(conversation);

          removeTyping();
          appendBubble(reply, "ai", null, model);

          if (model !== currentModel) {
            currentModel = model;
            if (![...modelSelect.options].some((o) => o.value === model)) {
              modelSelect.add(new Option(model, model));
            }
            modelSelect.value = model;
            appendSystemNote(`Switched to available model: ${model}`);
          }

          conversation.push({ role: "assistant", content: reply });
        } catch (err) {
          console.error("Puter.ai.chat error:", err);
          removeTyping();
          const msg = (err && err.message) || "Something went wrong contacting the AI.";
          appendBubble("⚠️ " + msg, "ai", "error-bubble");
        } finally {
          isWaiting = false;
          updateSendState();
          inputEl.focus();
        }
      }

      // ============================================================
      //  INIT
      // ============================================================
      (function init() {
        MODEL_CHAIN.forEach((m) => modelSelect.add(new Option(m, m)));
        modelSelect.value = currentModel;

        modelSelect.addEventListener("change", () => {
          currentModel = modelSelect.value;
          appendSystemNote(`Model set to ${currentModel}`);
        });

        appendBubble(
          "Hi! I'm running on Claude 3.7 Sonnet via Puter.js. " +
          "Pick a model in the top-right corner, then ask me anything.",
          "ai"
        );
        inputEl.focus();
      })();
    })();
  </script>
</body>
</html>
