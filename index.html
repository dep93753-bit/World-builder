ttps://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;link&#34;:&#34;https://shadysam.com/reward/bobble-head/reward_dog/&#34;,&#34;alt&#34;:&#34;&#34;,&#34;author&#34;:&#34;1&#34;,&#34;description&#34;:&#34;&#34;,&#34;caption&#34;:&#34;&#34;,&#34;name&#34;:&#34;reward_dog&#34;,&#34;status&#34;:&#34;inherit&#34;,&#34;uploaded_to&#34;:105,&#34;date&#34;:&#34;2018-11-05 16:50:38&#34;,&#34;modified&#34;:&#34;2018-11-05 16:56:12&#34;,&#34;menu_order&#34;:0,&#34;mime_type&#34;:&#34;image/png&#34;,&#34;type&#34;:&#34;image&#34;,&#34;subtype&#34;:&#34;png&#34;,&#34;icon&#34;:&#34;https://shadysam.com/wp-includes/images/media/default.png&#34;,&#34;width&#34;:52,&#34;height&#34;:58,&#34;sizes&#34;:{&#34;thumbnail&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;thumbnail-width&#34;:52,&#34;thumbnail-height&#34;:58,&#34;medium&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;medium-width&#34;:52,&#34;medium-height&#34;:58,&#34;medium_large&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;medium_large-width&#34;:52,&#34;medium_large-height&#34;:58,&#34;large&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;large-width&#34;:52,&#34;large-height&#34;:58,&#34;1536x1536&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;1536x1536-width&#34;:52,&#34;1536x1536-height&#34;:58,&#34;2048x2048&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_dog.png&#34;,&#34;2048x2048-width&#34;:52,&#34;2048x2048-height&#34;:58}},&#34;reward_animated&#34;:false}],&#34;email_body_copy&#34;:&#34;{{Name}},\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\n{{reward messaging}}&#34;,&#34;email_signature&#34;:&#34;I&#39;ll be out of the office for the next week, taking a nice vacation to the Bahamas. Hold the fort down for me, eh?&#34;},{&#34;title&#34;:&#34;game-over-email&#34;,&#34;id&#34;:109,&#34;email_type&#34;:&#34;Game Over&#34;,&#34;email_subject&#34;:&#34;Closing Time&#34;,&#34;email_body_copy&#34;:&#34;&#34;,&#34;email_close_button&#34;:&#34;Clock Out&#34;,&#34;good_copy&#34;:[{&#34;copy_option&#34;:&#34;Congrats {{Name}},\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nYou&#39;re a real winner. I&#39;m proud that I hired you. You&#39;ve got what it takes to rip folks off and not even blink twice. That&#39;s why they call you {{Adjective}} {{Name}} now. Shady Sam and {{Adjective}} {{Name}}, what a duo we make. You&#39;ve made ${{userTotal}}, and I think together we&#39;ll make much more.\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nGreat Job!\u003Cbr /\u003E\r\n- Sam&#34;}],&#34;bad_copy&#34;:[{&#34;copy_option&#34;:&#34;Wow {{Name}}, \u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nyou&#39;ve turned out to be a real disappointment. You&#39;ve shown too much mercy and pity and that&#39;s why they call you {{Adjective}} {{Name}}. I&#39;m sorry, in this business there just isn&#39;t room for that, and I can&#39;t have my reputation softened. Try a different career path. \u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nYou&#39;re fired.\u003Cbr /\u003E\r\nSam&#34;}],&#34;medium_copy&#34;:[{&#34;copy_option&#34;:&#34;Hey {{Name}},\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nYou&#39;re doing a fine job, but where&#39;s your ambition? I&#39;ll keep you on staff, but you&#39;ve gotta step it up if you want to be promoted. Your mediocre work has earned you the title of {{Adjective}} {{Name}}. \u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nSee ya tomorrow.\u003Cbr /\u003E\r\n-Sam&#34;}]},{&#34;title&#34;:&#34;special-student&#34;,&#34;id&#34;:204,&#34;email_type&#34;:&#34;Special Response&#34;,&#34;email_subject&#34;:&#34;Re: Robin&#34;,&#34;email_body_copy&#34;:&#34;{{Name}}\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nStudent loans are one of the most profitable in the country right now. I guess it&#39;s very trendy to have student debt, heh, heh, heh. Get a load of these numbers:\u003Cbr /\u003E\r\n\u003Cul\u003E\u003Cli\u003E44.2 million Americans have student loan debt\u003C/li\u003E\u003Cli\u003E$1.48 trillion in total US student loan debt\u003C/li\u003E\u003Cli\u003EAverage monthly payment: $351\u003C/li\u003E\u003C/ul\u003E\u003Cbr /\u003E\r\nI don&#39;t know about you, but those are some preeeeetty numbers for us.\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nThat&#39;s just my two cents.\u003Cbr /\u003E\r\n-Sam\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nPS: You can learn more about the real cost of college through \u003Ca href=\&#34;https://nas/content/live/shadysamprd.timeforpayback.com/\&#34; target=\&#34;_blank\&#34; rel=\&#34;noopener\&#34;\u003EPAYBACK\u003C/a\u003E.&#34;,&#34;email_close_button&#34;:&#34;Continue&#34;},{&#34;title&#34;:&#34;special-mortgage&#34;,&#34;id&#34;:242,&#34;email_type&#34;:&#34;Special Response&#34;,&#34;email_subject&#34;:&#34;Re: Steven&#34;,&#34;email_body_copy&#34;:&#34;{{Name}},\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nYou might&#39;ve noticed that the loan options were a little different when it comes to borrowing for a home. Sorry about that, I should&#39;ve given you a heads up. So loans for housing have a fancy name, mortgages. And you just issued one!\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nThere are two types: adjustable and fixed.\u003Cbr /\u003E\r\n\u003Col\u003E\u003Cbr /\u003E\r\n\u003Cli\u003EA fixed rate mortgage uses a fixed interest rate and a fixed length of time.\u003C/li\u003E\u003Cbr /\u003E\r\n\u003Cli\u003EAn adjustable rate mortgage has a fluctuating interest rate based on the market. It&#39;s hard to predict whether it will go up or down, but usually the initial rate is lower than a fixed rate.\u003C/li\u003E\u003C/ol\u003E\u003Cbr /\u003E\r\nWe make money either way, but the adjustable rate mortgages are where the cash really rolls in. Hook them with a low interest rate, then JACK IT UP LATER. Awwww yeah.\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nCatch ya on the shark side.\u003Cbr /\u003E\r\n- Sam&#34;,&#34;email_close_button&#34;:&#34;Continue&#34;},{&#34;title&#34;:&#34;progress-report-level-3&#34;,&#34;id&#34;:250,&#34;email_type&#34;:&#34;Progress Report&#34;,&#34;progress_report_level&#34;:3,&#34;email_subject&#34;:&#34;Mo&#39; money, no problems&#34;,&#34;email_body_copy&#34;:&#34;Howdy {{Name}},\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nDid you know that you&#39;ve served {{numCustomers}} customers so far?\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\n{{reward messaging}}\u003Cbr /\u003E\r\n&#34;,&#34;email_signature&#34;:&#34;I&#39;ll leave ya to it.\u003Cbr /\u003E\r\n-Sam&#34;,&#34;good_copy&#34;:[{&#34;copy_option&#34;:&#34;You keep getting better and better! I&#39;m going to run out of rewards at this rate. Go ahead and pick your next one.&#34;},{&#34;copy_option&#34;:&#34;You&#39;re a rockstar! You&#39;ve made ${{userTotal}} so far. Choose a new reward: &#34;},{&#34;copy_option&#34;:&#34;Hiring you was the best decision I&#39;ve ever made. Choose a reward:&#34;}],&#34;medium_copy&#34;:[{&#34;copy_option&#34;:&#34;I can&#39;t get mad because this is a fine performance, but I know you can do better. Here&#39;s a lil something to help motivate ya.&#34;},{&#34;copy_option&#34;:&#34;Mediocre performace = mediocre reward. &#34;},{&#34;copy_option&#34;:&#34;These numbers are meh. Get your head in the game! I&#39;ll choose your reward for you this time.&#34;}],&#34;bad_copy&#34;:[{&#34;copy_option&#34;:&#34;These numbers are unacceptable. If you keep this up, we&#39;ll be losing money. No reward for you.&#34;},{&#34;copy_option&#34;:&#34;Stop going easy on people! That doesn&#39;t make us any of the green stuff. I&#39;m not rewarding you this time.&#34;},{&#34;copy_option&#34;:&#34;{{Name}}, you&#39;re embarrassing me. I need you to try harder. I can&#39;t give you a reward based on these numbers.&#34;}],&#34;rewards_available&#34;:[{&#34;title&#34;:&#34;balls&#34;,&#34;id&#34;:320,&#34;reward_image&#34;:{&#34;ID&#34;:619,&#34;id&#34;:619,&#34;title&#34;:&#34;reward_newton&#34;,&#34;filename&#34;:&#34;reward_newton.png&#34;,&#34;filesize&#34;:318,&#34;url&#34 uploaded_to&#34;:321,&#34;date&#34;:&#34;2018-11-05 16:50:38&#34;,&#34;modified&#34;:&#34;2018-11-05 16:55:52&#34;,&#34;menu_order&#34;:0,&#34;mime_type&#34;:&#34;image/png&#34;,&#34;type&#34;:&#34;image&#34;,&#34;subtype&#34;:&#34;png&#34;,&#34;icon&#34;:&#34;https://shadysam.com/wp-includes/images/media/default.png&#34;,&#34;width&#34;:52,&#34;height&#34;:58,&#34;sizes&#34;:{&#34;thumbnail&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat.png&#34;,&#34;thumbnail-width&#34;:52,&#34;thumbnail-height&#34;:58,&#34;medium&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat.png&#34;,&#34;medium-width&#34;:52,&#34;medium-height&#34;:58,&#34;medium_large&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat.png&#34;,&#34;medium_large-width&#34;:52,&#34;medium_large-height&#34;:58,&#34;large&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat.png&#34;,&#34;large-width&#34;:52,&#34;large-height&#34;:58,&#34;1536x1536&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat.png&#34;,&#34;1536x1536-width&#34;:52,&#34;1536x1536-height&#34;:58,&#34;2048x2048&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat.png&#34;,&#34;2048x2048-width&#34;:52,&#34;2048x2048-height&#34;:58}},&#34;reward_animated&#34;:&#34;https://shadysam.com/wp-content/uploads/reward_cat_anim.gif&#34;}],&#34;email_close_button&#34;:&#34;Continue&#34;},{&#34;title&#34;:&#34;payday-first&#34;,&#34;id&#34;:650,&#34;email_type&#34;:&#34;Special Response&#34;,&#34;email_subject&#34;:&#34;Re: {{Customer}}&#34;,&#34;email_body_copy&#34;:&#34;Well, well, well. Looky at what we\u2019ve found here \u2013 a payday loan opportunity! These poor folks are living paycheck to paycheck, with no other choices but good &#39;ol Shady Sam. And you can get them to agree to basically anything! \u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nAnd get this \u2013 since it\u2019s such a small amount and a short term, we\u2019ll charge a fee instead of interest. The best part? If you do the math, that measly fee can be something like a 700% interest rate!  Good thing nobody does the math, except us.\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nI have a feeling that won\u2019t be the last time we see {{Customer}}. \u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nCha-ching!\u003Cbr /\u003E\r\nSam&#34;,&#34;email_close_button&#34;:&#34;Continue&#34;},{&#34;title&#34;:&#34;payday-last&#34;,&#34;id&#34;:651,&#34;email_type&#34;:&#34;Special Response&#34;,&#34;email_subject&#34;:&#34;Re: {{Customer}}&#34;,&#34;email_body_copy&#34;:&#34;Looks like we\u2019ve got someone trapped in a cycle here \u2013 they\u2019ll keep coming back and paying that lower fee instead of our full payoff amount. Who knows how long we can keep this going?\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nThat&#39;s the best type of client that could walk through that door. Poor, desperate, with no other choices except for good &#39;ol Shady Sam. And you can get them to agree to basically anything!\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nSo far, they\u2019ve paid ${{PaydayFees}} in fees on a loan that was just $345. How crazy is that? Crazy good, if you ask me.\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nMuahahahahah,\u003Cbr /\u003E\r\nSam&#34;,&#34;email_close_button&#34;:&#34;Continue&#34;},{&#34;title&#34;:&#34;after-first-returner&#34;,&#34;id&#34;:675,&#34;email_type&#34;:&#34;Special Response&#34;,&#34;email_subject&#34;:&#34;Re: {{Customer}}&#34;,&#34;email_body_copy&#34;:&#34;{{Name}},\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nThe initial loan isn\u2019t our only chance to make money. We can hide all kinds of good stuff in the contract \u2013 payoff fees, late fees, allllll the fees. And nobody pays attention until it\u2019s too late. Isn\u2019t it great?\u003Cbr /\u003E\r\n\u003Cbr /\u003E\r\nIt&#39;s a good day to be a shark.\u003Cbr /\u003E\r\nSam&#34;,&#34;email_close_button&#34;:&#34;Continue&#34;}],&#34;person&#34;:[{&#34;title&#34;:&#34;Beth&#34;,&#34;id&#34;:420,&#34;picture&#34;:&#34;https://shadysam.co hering, use and dissemination practices solely for the website located at https://shadysamprd.wpengine.com (the &amp;#8220;Website&amp;#8221;).\u003C/p\u003E\n\u003Cp\u003EBy using or accessing the Website, you signify your assent to our Privacy Policy. IF YOU DO NOT AGREE TO THIS PRIVACY POLICY YOU MAY NOT ACCESS OR OTHERWISE USE THE WEBSITE.\u003C/p\u003E\n\u003Ch3\u003EPersonal and Non-Personally Identifiable Information\u003C/h3\u003E\n\u003Cp\u003EWhen using the Website, you may choose to provide NGPF with certain personally identifiable information about yourself (&amp;#8220;Personally Identifiable Information&amp;#8221;). Personally Identifiable Information can include your name and email address. In addition, we may also collect non-personally identifiable information, such as IP host address, pages viewed, browser type and other data, and may aggregate any information collected in a manner which does not identify any individual (&amp;#8220;Aggregate Information&amp;#8221;).\u003C/p\u003E\n\u003Ch3\u003EInformation Usage\u003C/h3\u003E\n\u003Cp\u003EUnless disclosed otherwise at the time of collection, we do not share any Personally Identifiable Information you submit through the Website with any unaffiliated third party, unless it is necessary to respond to your inquiry, or to comply with applicable law. We may use Aggregate Information to improve and enhance your experience on the Website and for our research activities. For example, we may share Aggregate Information with unaffiliated third parties, such as business partners, in an aggregate, anonymous form, which means that the shared information will not contain nor be linked to any Personally Identifiable Information.\u003C/p\u003E\n\u003Cp\u003EWe will not sell your Personally Identifiable Information to any third party not affiliated with NGPF without your consent, except we may do so without your consent in connection with the sale or merger of NGPF or the division responsible for such services.\u003C/p\u003E\n\u003Cp\u003EPlease note that we reserve the right to access and/or disclose Personally Identifiable Information and non-personal information we gather as required by courts or administrative agencies and to the extent required to permit us to investigate suspected fraud, harassment or other violations of any law, rule or regulation, the Website rules or policies, or the rights of third parties or to investigate any suspected conduct which we deem improper.\u003C/p\u003E\n\u003Ch3\u003ESecurity\u003C/h3\u003E\n\u003Cp\u003EThe security of your Personally Identifiable Information is very important to us. We have put in place reasonable physical, electronic, and managerial procedures to safeguard the information we collect. We cannot state that we can completely guarantee that communications between you and NGPF or information stored on the Website or our servers will be completely free from unauthorized access by third parties such as hackers. Therefore, by using the Website, you acknowledge that the potential for unauthorized access still exists and you agree to assume this risk.\u003C/p\u003E\n\u003Ch3\u003EProtection for Children\u003C/h3\u003E\n\u003Cp\u003EWe have no intention of collecting personal information from children under the age of 13. When we become aware that personal information from a child under 13 has been collected without such child&amp;#8217;s parent or guardian&amp;#8217;s consent, we will use all reasonable efforts to delete such information from our database.\u003C/p\u003E\n\u003Ch3\u003EChanges to Policy; Opt-Out Process\u003C/h3\u003E\n\u003Cp\u003EWe reserve the right, at our discretion, to change, modify, add, or remove portions from this policy at any time. However, if at any time in the future we plan to use Personally Identifiable Information in a way that differs from this policy, we will post such changes here and provide you the opportunity to opt-out of such differing uses. Your continued use of the Website following the posting of any changes to this policy means you accept such changes. We give you the option to remove your Personally Identifiable Information from any lists that we maintain of users. All unsubscribe or opt-out requests should be sent to us at email@nextgenpersonalfinance.com and we will process your request within a reasonable time after receipt. We are not responsible for removing your Personally Identifiable Information from the lists of any third party who has previously been provided your information in accordance with this policy.\u003C/p\u003E\n\u003Ch3\u003EContact\u003C/h3\u003E\n\u003Cp\u003EFor questions or concerns relating to privacy, we can be contacted at \u003Ca href=\&#34;mailto:email@nextgenpersonalfinance.com\&#34;\u003Eemail@nextgenpersonalfinance.com\u003C/a\u003E.\u003C/p\u003E\n\u003Ch3\u003EUnited States of America\u003C/h3\u003E\n\u003Cp\u003EOur Website is maintained in the United States of America. By using the Website, you expressly authorize us to export your Personally Identifiable Information to the USA and to store and use it in the USA as specified in this policy.\u003C/p\u003E\n\u003Ch3\u003EEffective Date\u003C/h3\u003E\n\u003Cp\u003EThis privacy policy is effective and was last updated on 9/25/2018.\u003C/p\u003E\n&#34;,&#34;about_content&#34;:&#34;\u003Ch2\u003EAbout this game:\u003C/h2\u003E\n\u003Cp\u003EShady Sam was designed to demonstrate how loan terms can hurt you if you don&amp;#8217;t pay attention.\u003C/p\u003E\n\u003Ch2\u003EPresented by NGPF:\u003C/h2\u003E\n\u003Cp\u003E\u003Ca href=\&#34;https://www.ngpf.org/\&#34; target=\&#34;_blank\&#34; rel=\&#34;noopener\&#34;\u003ENGPF\u003C/a\u003E, who is revolutionizing the teaching of personal finance to improve the financial lives of the next generation of Americans.\u003C/p\u003E\n\u003Ch2\u003EHey Teachers!\u003C/h2\u003E\n\u003Cp\u003ETo get the most out of playing Shady Sam with your students, have them complete our companion worksheets: \u003Ca href=\&#34;https
